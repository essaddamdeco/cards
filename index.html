<html lang="ar" dir="rtl">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>صانع البطاقات الرقمية</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap">
<style>
:root{--bg:#f6f4fb;--sf:#fff;--tx:#1d1530;--mu:#6b6480;--ln:#e2dcf0;--ac:#6a11cb;--ac2:#ff3d81;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#130e22;--sf:#1e1733;--tx:#f3eefc;--mu:#a79fc0;--ln:#352b52}}
:root[data-theme="dark"]{--bg:#130e22;--sf:#1e1733;--tx:#f3eefc;--mu:#a79fc0;--ln:#352b52}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font-family:"Cairo",system-ui,"Segoe UI",Tahoma,sans-serif;line-height:1.6}
header{padding:20px 18px 6px;max-width:1100px;margin:auto}
h1{margin:0;font-size:1.6rem;font-weight:800;background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}
header p{margin:2px 0 0;color:var(--mu);font-size:.95rem}
.tabs{display:flex;gap:8px;padding:12px 18px;max-width:1100px;margin:auto}
.tabs button{flex:1;padding:10px;border:1px solid var(--ln);background:var(--sf);color:var(--tx);border-radius:12px;font:inherit;font-weight:600;cursor:pointer}
.tabs button.on{background:linear-gradient(90deg,var(--ac),var(--ac2));color:#fff;border-color:transparent}
.grid{display:grid;gap:18px;padding:0 18px 40px;max-width:1100px;margin:auto}
@media(min-width:900px){.tabs{display:none}.grid{grid-template-columns:1fr 420px;align-items:start}#prev{position:sticky;top:12px}#form,#prev{display:block!important}}
section{background:var(--sf);border:1px solid var(--ln);border-radius:20px;padding:18px}
h2{font-size:1.05rem;margin:18px 0 8px;font-weight:800}
h2:first-child{margin-top:0}
label{display:block;font-size:.88rem;color:var(--mu);margin:10px 0 4px;font-weight:600}
input[type=text],input[type=tel],textarea{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--ln);background:var(--bg);color:var(--tx);font:inherit;font-size:1rem}
input:focus-visible,textarea:focus-visible,button:focus-visible{outline:3px solid var(--ac2);outline-offset:2px}
textarea{min-height:76px;resize:vertical}
.themes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.themes button{border:3px solid transparent;border-radius:14px;height:64px;color:#fff;font:inherit;font-weight:800;font-size:.9rem;cursor:pointer;text-shadow:0 1px 6px rgba(0,0,0,.5)}
.themes button.on{border-color:var(--tx)}
.pick{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pick .btn{padding:9px 14px;border-radius:12px;border:1px dashed var(--ac);color:var(--ac);font-weight:600;cursor:pointer;background:transparent;font-family:inherit;font-size:.95rem}
.th{display:flex;gap:6px;flex-wrap:wrap}
.th div{position:relative;width:54px;height:54px;border-radius:12px;background-size:cover;background-position:center;border:1px solid var(--ln)}
.th b{position:absolute;top:-6px;inset-inline-start:-6px;width:22px;height:22px;border-radius:50%;background:#e11d48;color:#fff;font-size:14px;line-height:22px;text-align:center;cursor:pointer}
.go{width:100%;margin-top:14px;padding:14px;border:0;border-radius:14px;font:inherit;font-weight:800;font-size:1.05rem;color:#fff;background:linear-gradient(90deg,var(--ac),var(--ac2));cursor:pointer}
.go.sec{background:transparent;color:var(--tx);border:1px solid var(--ln);font-weight:600;margin-top:8px}
.hint{color:var(--mu);font-size:.85rem;margin:10px 0 0}
.frame{width:100%;max-width:390px;height:690px;margin:0 auto;display:block;border:6px solid #15101f;border-radius:34px;background:#000}
@media(max-width:899px){.frame{height:74vh}}
.bgs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.bgs button{aspect-ratio:9/14;border:2px solid var(--ln);border-radius:10px;background-size:cover;background-position:center;cursor:pointer;padding:0}
.msg{min-height:1.4em;font-size:.9rem;margin-top:8px;color:var(--ac2);font-weight:600}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
</head>
<body>
<header><h1>صانع البطاقات الرقمية</h1><p>املأ معلومات العميل، شاهد البطاقة مباشرة، ثم نزّل الصفحة لتكتب رابطها على بطاقة NFC.</p></header>
<div class="tabs"><button id="t1" class="on">المعلومات</button><button id="t2">المعاينة</button></div>
<main class="grid">
<section id="form"></section>
<section id="prev">
<iframe class="frame" id="fr" title="معاينة البطاقة"></iframe>
<button class="go" id="dl">تنزيل البطاقة (ملف HTML)</button>
<button class="go sec" id="cp">نسخ الكود</button>
<button class="go sec" id="nw">عميل جديد (تفريغ النموذج)</button>
<div class="msg" id="msg" role="status"></div>
<p class="hint">ارفع الملف على GitHub Pages أو Netlify، ثم اكتب الرابط الناتج على بطاقة NFC.</p>
<h2>رمز QR</h2>
<label for="qu">رابط البطاقة بعد رفعها</label>
<input id="qu" type="text" dir="ltr" inputmode="url" placeholder="https://">
<button class="go sec" id="qg">إنشاء QR</button>
<img id="qi" alt="رمز QR للبطاقة" style="display:none;width:220px;max-width:100%;margin:14px auto 0;border-radius:12px;background:#fff">
<button class="go" id="qd" style="display:none">تنزيل QR (صورة PNG)</button>
</section>
</main>

/* qr */
var qc=null;
document.getElementById('qg').onclick=function(){var u=document.getElementById('qu').value.trim();
if(!/^https?:\/\//i.test(u)){msg.textContent='اكتب رابط البطاقة كاملًا ويبدأ بـ https://';return}
if(typeof qrcode!=='function'){msg.textContent='تعذّر تحميل مكتبة QR، تحقق من الاتصال.';return}
var q=qrcode(0,'M');q.addData(u);q.make();var n=q.getModuleCount(),s=10,mg=4,sz=(n+mg*2)*s,c=document.createElement('canvas');c.width=c.height=sz;var x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,sz,sz);x.fillStyle='#000';
for(var r=0;r<n;r++)for(var k=0;k<n;k++)if(q.isDark(r,k))x.fillRect((k+mg)*s,(r+mg)*s,s,s);
qc=c;var i=document.getElementById('qi');i.src=c.toDataURL('image/png');i.style.display='block';document.getElementById('qd').style.display='block';msg.textContent=''};
document.getElementById('qd').onclick=async function(){if(!qc)return;var dls=null;try{dls=await claude.use('downloads')}catch(e){}
if(!dls){var a=document.createElement('a');a.href=qc.toDataURL('image/png');a.download='qr-'+slug()+'.png';document.body.appendChild(a);a.click();a.remove();msg.textContent='تم التنزيل.';return}
qc.toBlob(async function(b){try{await dls.save({filename:'qr-'+slug()+'.png',data:b});msg.textContent='تم تجهيز الصورة.'}catch(e){msg.textContent=e&&e.code=='declined'?'':'تعذّر التنزيل، اضغط مطولًا على الصورة لحفظها.'}},'image/png')};
/* tabs */
var f=document.getElementById('form'),p=document.getElementById('prev'),t1=document.getElementById('t1'),t2=document.getElementById('t2');
function tab(a){f.style.display=a?'block':'none';p.style.display=a?'none':'block';t1.className=a?'on':'';t2.className=a?'':'on'}
t1.onclick=function(){tab(1)};t2.onclick=function(){tab(0)};tab(1);
var KEY='cardmaker:v1';
function save(){try{var d=vals();d.theme=S.theme;localStorage.setItem(KEY,JSON.stringify(d))}catch(e){}}
function restore(){try{var d=JSON.parse(localStorage.getItem(KEY)||'null');if(!d)return;F.forEach(function(f){if(d[f[0]])document.getElementById('f_'+f[0]).value=d[f[0]]});if(typeof d.theme=='number'&&THEMES[d.theme])S.theme=d.theme}catch(e){}}
var nwArm=0,nwTxt='عميل جديد (تفريغ النموذج)';
document.getElementById('nw').onclick=function(){var b=this;if(!nwArm){nwArm=1;b.textContent='اضغط مرة أخرى للتأكيد';setTimeout(function(){nwArm=0;b.textContent=nwTxt},3000);return}
nwArm=0;b.textContent=nwTxt;F.forEach(function(f){document.getElementById('f_'+f[0]).value=''});S.avatar=S.logo=S.cover='';S.gal=[];S.theme=0;document.getElementById('qu').value='';try{localStorage.removeItem(KEY)}catch(e){}upd(1);try{localStorage.removeItem(KEY)}catch(e){}};
restore();
upd(1);
</script>
</body>
